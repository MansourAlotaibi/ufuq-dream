name: Validate source
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UFUQ_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - name: Public asset integrity
        run: |
          python3 tools/check_public_assets.py
          python3 tools/check_content_library.py
          python3 tools/check_repository.py
      - name: Build, lint and unit tests
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug lintRelease test
      - name: Host video pipeline
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Preserve unsigned candidate and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate-and-reports
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-*.html
            app/build/test-results/test*UnitTest/*.xml
          retention-days: 14
